name: Build Fate Simul Night APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fate-simul-night-debug-signing-v1

      - name: Recreate Fate Simul Night project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          files = {
              'build.gradle.kts': 'cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjcuMyIgYXBwbHkgZmFsc2UKfQo=',
              'settings.gradle.kts': '',
              'gradle.properties': 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCg==',
              'app/build.gradle.kts': '',
              'app/src/main/AndroidManifest.xml': '',
              'app/src/main/java/com/sora/fatesimulnight/MainActivity.java': '',
              'app/src/main/res/values/strings.xml': 'PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPkZhdGUvU2ltdWwgTmlnaHQ8L3N0cmluZz4KPC9yZXNvdXJjZXM+Cg==',
              'app/src/main/res/values/themes.xml': '',
              'app/src/main/assets/index.html': '',
          }
          for name, data in files.items():
              p = pathlib.Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(data))
          PY

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Fate-Simul-Night-v0.3.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fate-Simul-Night-v0.3.0-APK
          path: Fate-Simul-Night-v0.3.0.apk
          retention-days: 90
